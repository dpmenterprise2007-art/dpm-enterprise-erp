services:
  db:
    image: postgres:16-alpine
    container_name: dpm-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dpm_erp
      POSTGRES_USER: dpm_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - dpm_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpm_erp -d dpm_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dpm_erp_pgdata:
